name: veebot
version: 1.0.0

services:
  veebot:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: veebot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      # Persist database file
      - ./database2.sqlite:/app/database2.sqlite
      # Persist logs
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
